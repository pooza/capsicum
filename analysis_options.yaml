# モノレポのルート。
#
# ⚠⚠ **この設定はどの Dart ファイルにも効いていない (#1027-D)。**
# analyzer は「対象ファイルから見て最も近い `analysis_options.yaml`」だけを
# 使う。`packages/*` は 4 つとも自前の設定を持っており、**`packages/` の外に
# Dart ファイルは 1 つも無い**（2026-08-27 時点で 0 件）。
#
# つまり下の `prefer_const_constructors` / `prefer_final_locals` /
# `avoid_print` は**有効に見えて 1 行も検査していない**。ここを読んで
# 「リポジトリ全体で const が強制されている」と思わないこと。
#
# ⚠ **消さずに残しているのは、`packages/` 外に Dart を置いた瞬間に効かせる
# ため**（ツール類のスクリプト等）。
#
# ⚠ **全パッケージへ効かせる件は先送りと決めた**（2026-08-27）。既存コードに
# 数百件の info が出る作業で、ユーザー要望由来ではないため。1.x は外部要因の
# 発生ベースで回している。**再提案しないこと** — 提案するなら、それを要求する
# 外部要因（実害の報告など）が先にあること。
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    avoid_print: true
