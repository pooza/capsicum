name: capsicum
description: Flutter-based Mastodon / Misskey client
publish_to: none
version: 1.24.1+66

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  capsicum_core:
    path: ../capsicum_core
  capsicum_backends:
    path: ../capsicum_backends
  fediverse_objects:
    path: ../fediverse_objects
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  # iOS の App Group suiteName を指定するため
  # `SharedPreferencesAsyncFoundationOptions` を参照しており、その型は
  # shared_preferences_foundation の公開 API にある。transitive 依存だが
  # 直接 import するため明示する（NotificationLabelCache が NSE と
  # UserDefaults を共有するのに必要）。
  shared_preferences_foundation: ^2.5.0
  dio: ^5.8.0+1
  flutter_web_auth_2: ^4.0.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.0
  image_picker: ^1.2.1
  # Linux / Windows のメディア選択は image_picker 非対応のため file_selector を
  # 経由する。MediaPicker 抽象層 (#329) でプラットフォームごとに実装を
  # 切り替える。
  file_selector: ^1.0.3
  # MediaPicker 抽象層 (#329) は image_picker / file_selector のどちらにも
  # 依存しない純インターフェースとして cross_file の XFile だけを参照する。
  # transitive 依存だが直接 import するため明示する。
  cross_file: ^0.3.4
  path_provider: ^2.1.0
  video_player: ^2.11.0
  package_info_plus: ^8.3.0
  sentry_flutter: ^9.14.0
  scrollable_positioned_list: ^0.3.8
  yaml: ^3.1.0
  html_unescape: ^2.0.0
  emoji_picker_flutter: ^4.3.0
  pointycastle: ^3.9.1
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  sentry_dart_plugin: ^2.3.0
  # SharedPreferencesAsyncPlatform のテスト用 in-memory 実装を使うため。
  # 通常は shared_preferences 経由の transitive だが、lint
  # (depend_on_referenced_packages) 回避のため明示する。
  shared_preferences_platform_interface: ^2.4.0

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: capsicum
  org: b-shock-co-ltd

flutter:
  uses-material-design: true
  assets:
    - assets/images/
