name: capsicum
description: Flutter-based Mastodon / Misskey client
publish_to: none
version: 1.24.0+60

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  capsicum_core:
    path: ../capsicum_core
  capsicum_backends:
    path: ../capsicum_backends
  fediverse_objects:
    path: ../fediverse_objects
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  # iOS の App Group suiteName を指定するため
  # `SharedPreferencesAsyncFoundationOptions` を参照しており、その型は
  # shared_preferences_foundation の公開 API にある。transitive 依存だが
  # 直接 import するため明示する（NotificationLabelCache が NSE と
  # UserDefaults を共有するのに必要）。
  shared_preferences_foundation: ^2.5.0
  dio: ^5.8.0+1
  flutter_web_auth_2: ^4.0.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.0
  image_picker: ^1.2.1
  # Linux / Windows のメディア選択は image_picker 非対応のため file_selector を
  # 経由する。MediaPicker 抽象層 (#329) でプラットフォームごとに実装を
  # 切り替える。
  file_selector: ^1.0.3
  # MediaPicker 抽象層 (#329) は image_picker / file_selector のどちらにも
  # 依存しない純インターフェースとして cross_file の XFile だけを参照する。
  # transitive 依存だが直接 import するため明示する。
  cross_file: ^0.3.4
  path_provider: ^2.1.0
  video_player: ^2.11.0
  package_info_plus: ^8.3.0
  sentry_flutter: ^9.14.0
  scrollable_positioned_list: ^0.3.8
  yaml: ^3.1.0
  html_unescape: ^2.0.0
  emoji_picker_flutter: ^4.3.0
  pointycastle: ^3.9.1
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  sentry_dart_plugin: ^2.3.0
  # SharedPreferencesAsyncPlatform のテスト用 in-memory 実装を使うため。
  # 通常は shared_preferences 経由の transitive だが、lint
  # (depend_on_referenced_packages) 回避のため明示する。
  shared_preferences_platform_interface: ^2.4.0
  # Windows MSIX パッケージング (#423)。dart run msix:create で
  # build/windows/x64/runner/Release/ 配下に capsicum.msix を生成する。
  # Microsoft Store 提出時は store: true により未署名のままアップロード、
  # ストア側で再署名される。
  msix: ^3.16.13

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: capsicum
  org: b-shock-co-ltd

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Windows MSIX パッケージング設定 (#423)。
#
# identity_name / publisher は Microsoft Partner Center で capsicum を
# アプリ予約した時点で確定した識別子。MSIX 提出時にこの値が一致しないと
# ストア側でバリデーション失敗するため固定値で埋めている。
#
# 配布アーキは v1.24 リリース時点で x64 1 本（ARM64 ユーザーは Windows の
# x64 emulation 経由で動作）。後日 ARM64 を追加する場合は同一プロダクトに
# 別 MSIX として bundle する（Microsoft Store 側で arch 振り分け）。
msix_config:
  display_name: capsicum
  # 3 ストア（Apple / Google / Microsoft）すべて個人発行元 (小石達也) で
  # 整合させる方針。法人 (有限会社ビーショック) への切替は税務・ブランド
  # 要請が顕在化した時点で一括移行する。詳細は CLAUDE.md「運営元」節参照。
  publisher_display_name: 小石達也
  identity_name: 9AFBB08E.capsicum
  publisher: CN=0B8EE9C3-CB07-4EBE-B8B8-B73E973AEE42
  logo_path: windows/runner/resources/app_icon.png
  capabilities: internetClient
  architecture: x64
  languages: ja-jp, en-us
  # Microsoft Store 提出用。ストア側で再署名されるため自前証明書は不要。
  store: true
  output_name: capsicum
