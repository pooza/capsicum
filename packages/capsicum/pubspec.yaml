name: capsicum
description: Flutter-based Mastodon / Misskey client
publish_to: none
version: 1.40.0+126

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  capsicum_core:
    path: ../capsicum_core
  capsicum_backends:
    path: ../capsicum_backends
  fediverse_objects:
    path: ../fediverse_objects
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  # iOS の App Group suiteName を指定するため
  # `SharedPreferencesAsyncFoundationOptions` を参照しており、その型は
  # shared_preferences_foundation の公開 API にある。transitive 依存だが
  # 直接 import するため明示する（NotificationLabelCache が NSE と
  # UserDefaults を共有するのに必要）。
  shared_preferences_foundation: ^2.5.0
  dio: ^5.8.0+1
  flutter_web_auth_2: ^4.0.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^21.0.0
  image_picker: ^1.2.1
  # Linux / Windows のメディア選択は image_picker 非対応のため file_selector を
  # 経由する。MediaPicker 抽象層 (#329) でプラットフォームごとに実装を
  # 切り替える。
  file_selector: ^1.0.3
  # MediaPicker 抽象層 (#329) は image_picker / file_selector のどちらにも
  # 依存しない純インターフェースとして cross_file の XFile だけを参照する。
  # transitive 依存だが直接 import するため明示する。
  cross_file: ^0.3.4
  path_provider: ^2.1.0
  package_info_plus: ^8.3.0
  sentry_flutter: ^9.14.0
  scrollable_positioned_list: ^0.3.8
  yaml: ^3.1.0
  html_unescape: ^2.0.0
  emoji_picker_flutter: ^4.3.0
  pointycastle: ^3.9.1
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4
  # デスクトップ (macOS / Linux / Windows) のウィンドウ位置・サイズ・最大化状態
  # を起動間で記録 / 復元するために使用 (#559)。実況用途で「アプリを同じ場所に
  # 置く」運用 (e.g. Amazon Prime Video と左右並列) を支える。モバイルは
  # OS がウィンドウを持たないため対象外。
  window_manager: ^0.5.1
  # デスクトップ常駐モード (#752) のシステムトレイ / メニューバー常駐。
  # window_manager の close 傍受 + hide と組み合わせ、ウィンドウを閉じても
  # トレイ (Windows / Linux) / メニューバー (macOS) に常駐させる。モバイル対象外。
  tray_manager: ^0.5.0
  # サポーター（投げ銭）の消耗型 IAP (#428)。iOS StoreKit / Android Play
  # Billing を統一 API で扱う。購入導線は iOS / Android のみ（macOS は後日、
  # Linux / Windows はストア IAP 不在）。商品タイプ・保持先は
  # SupporterStatus 抽象層の内側に隠し、UI からは直接触らせない。
  in_app_purchase: ^3.2.0
  desktop_drop: ^0.7.1
  # 添付画像のトリミング (#577 デスクトップ / #647 モバイル)。image_cropper は
  # iOS/Android/Web のみ対応でデスクトップ非対応のため、platform channel 不要の
  # 純 Flutter 実装である crop_your_image を採用する。Uint8List をメモリ上で
  # 処理するため全プラットフォーム (iOS / Android / macOS / Windows / Linux) で
  # 同一経路で動作する。
  crop_your_image: ^2.0.0
  # 動画 / 音声再生 (#492)。旧 video_player は Linux 実装が無く Windows も
  # 棚上げで、デスクトップ 2 OS で再生が機能しなかった。media_kit は libmpv
  # ベースで iOS / Android / macOS / Windows / Linux 全対応のため一本化する。
  # media_kit_libs_video が各 OS のネイティブ libmpv を同梱する (Linux/Windows
  # でもシステム依存なしで動く)。MediaKit.ensureInitialized() を main で呼ぶ。
  media_kit: ^1.2.6
  # media_kit_video は 1.3.x にピン（2.0.x は避ける）。2.0.0/2.0.1 (2025-11/12) は
  # Linux の VideoOutput を書き直し、生成時 (プラットフォームスレッド＝EGL
  # コンテキスト非 current) に eglGetCurrentContext で Flutter の EGL を掴もうと
  # して失敗 → S/W fallback でも映像が出ない回帰がある (#492 で Intel iHD/X11/
  # AppImage で再現)。1.3.1 は描画スレッドのテクスチャコールバック内で GL を
  # 扱う成熟実装で、media_kit ^1.2.1 要求のため core 1.2.6 と互換。
  media_kit_video: ">=1.3.1 <2.0.0"
  media_kit_libs_video: ^1.0.7
  # Linux のプレイヤー横断ナウプレ取得 (#466)。MPRIS (org.mpris.MediaPlayer2.*,
  # D-Bus セッションバス) を pure-Dart で叩く（FFI 不要）。Linux 専用機能だが
  # pure Dart なので全プラットフォームでコンパイルは通る。実際の接続は
  # NowPlayingProvider factory が Linux のときだけ MprisNowPlayingProvider を
  # 生成するため、他 OS では DBusClient を起こさない。
  dbus: ^0.7.12
  # モバイル (iOS / Android) のメディアビューア保存先 = カメラロール /
  # ギャラリー (#646)。デスクトップ 3 OS は file_selector の保存ダイアログ
  # (#572) を使うため、gal はモバイルのみで呼ばれる。
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  sentry_dart_plugin: ^2.3.0
  # SharedPreferencesAsyncPlatform のテスト用 in-memory 実装を使うため。
  # 通常は shared_preferences 経由の transitive だが、lint
  # (depend_on_referenced_packages) 回避のため明示する。
  shared_preferences_platform_interface: ^2.4.0
  # Windows MSIX パッケージング (#423)。dart run msix:create で
  # build/windows/x64/runner/Release/ 配下に capsicum.msix を生成する。
  # Microsoft Store 提出時は store: true により未署名のままアップロード、
  # ストア側で再署名される。
  msix: ^3.16.13

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: capsicum
  org: b-shock-co-ltd

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Windows MSIX パッケージング設定 (#423)。
#
# identity_name / publisher は Microsoft Partner Center で capsicum を
# アプリ予約した時点で確定した識別子。MSIX 提出時にこの値が一致しないと
# ストア側でバリデーション失敗するため固定値で埋めている。
#
# 配布アーキは v1.24 リリース時点で x64 1 本（ARM64 ユーザーは Windows の
# x64 emulation 経由で動作）。後日 ARM64 を追加する場合は同一プロダクトに
# 別 MSIX として bundle する（Microsoft Store 側で arch 振り分け）。
msix_config:
  display_name: capsicum
  # 3 ストア（Apple / Google / Microsoft）すべて個人発行元 (小石達也) で
  # 整合させる方針。法人 (有限会社ビーショック) への切替は税務・ブランド
  # 要請が顕在化した時点で一括移行する。詳細は CLAUDE.md「運営元」節参照。
  publisher_display_name: 小石達也
  # identity_name は通知の appUserModelId と一致が必須。コード側の
  # single source of truth は constants.dart の WindowsIdentifiers.appUserModelId
  # (#554)。変更時は両方を更新すること。
  identity_name: 9AFBB08E.capsicum
  publisher: CN=0B8EE9C3-CB07-4EBE-B8B8-B73E973AEE42
  logo_path: windows/runner/resources/app_icon.png
  capabilities: internetClient
  architecture: x64
  languages: ja-jp, en-us
  # 自己署名 MSIX 直配 (#423) では false 必須。msix:create は
  # `signMsix && !store` の条件で signtool を呼ぶため、true のままだと
  # --certificate-path を渡しても署名 step が skip され AppxSignature.p7x が
  # 生成されない (実機で `Add-AppxPackage` が拒否される)。Microsoft Store
  # 公開 (#544) を再開する際は別経路で --store を渡す。
  store: false
  # CI には TTY がないため、msix:create の証明書インストール確認プロンプト
  # (y/N) が呼ばれると Prompter で stdin null → 'Null is not a subtype of
  # FutureOr<String>' で落ちる。CI 上でローカルに cert を import する用途は
  # ないので無効化する。
  install_certificate: false
  output_name: capsicum
  # 通知アクティベータの COM CLSID。flutter_local_notifications_windows が
  # 通知タップ時にこの CLSID を介してアプリにコールバックする。コード側の
  # single source of truth は constants.dart の
  # WindowsIdentifiers.toastActivatorClsid (#554)。
  # WindowsInitializationSettings.guid と完全一致させること (#423)。
  toast_activator:
    clsid: 'c97e7770-db27-4202-96cc-739a44734e65'
    arguments: '----AppNotificationActivationServer'
    display_name: 'capsicum'
