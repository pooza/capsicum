name: capsicum_workspace
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  - packages/capsicum
  - packages/capsicum_core
  - packages/capsicum_backends
  - packages/fediverse_objects

dev_dependencies:
  melos: ^7.4.0

melos:
  name: capsicum
  repository: https://github.com/pooza/capsicum

  scripts:
    analyze:
      run: dart analyze --fatal-infos
      exec:
        concurrency: 1
      description: Run dart analyze in all packages

    test:
      run: flutter test
      exec:
        concurrency: 1
      packageFilters:
        dirExists: test
      description: Run tests in all packages

    build_runner:
      run: dart run build_runner build --delete-conflicting-outputs
      exec:
        concurrency: 1
      packageFilters:
        dependsOn: build_runner
      description: Run build_runner in packages that use it

    gen_l10n:
      run: flutter gen-l10n
      exec:
        concurrency: 1
      packageFilters:
        fileExists: l10n.yaml
      description: Generate localizations

# flutter_secure_storage_linux 3.0.3 は xdg:schema が壊れ、ログインのたびに他アカウントのトークンが消える（#1387・上流 #1230 / #1249）。
# 修正は 4.0.0-beta.1 にしか無い。正式版が pub.dev に出たら override を外す（docs/flutter-upstream-watch.md の監視対象）。
dependency_overrides:
  flutter_secure_storage_linux: 4.0.0-beta.1
