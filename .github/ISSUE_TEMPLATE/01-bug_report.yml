name: バグ報告
description: 不具合・意図しない動作の報告
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きているかを簡潔に
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: どうすれば再現できるか
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
      description: どうなるべきか
    validations:
      required: false
  - type: checkboxes
    id: platforms
    attributes:
      label: プラットフォーム
      description: 該当するものを選択 (複数可)
      options:
        - label: Android
        - label: iOS / iPadOS
        - label: macOS
        - label: Linux (AppImage)
        - label: Windows (MSIX)
        - label: 未確認 / 不明
  - type: textarea
    id: extra
    attributes:
      label: 補足
      description: サーバー名、バージョン、スクリーンショット、ログなど
    validations:
      required: false
