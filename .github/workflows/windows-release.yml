name: Windows Release

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    branches: [develop, main]
    paths:
      - 'packages/capsicum/windows/**'
      - 'packages/capsicum/pubspec.yaml'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

jobs:
  # 自己署名 MSIX を windows-latest (x64) で組み立てて
  # GitHub Releases (draft) に .msix + .cer を添付する (#423)。
  # Microsoft Store 公開 (#544) は on-hold だが、msstore CLI publish step は
  # Repository Secrets 投入後に自動有効化される構造を維持しておく
  # (未投入なら publish step は skip)。手順は store-release-guide.md §4.6 参照。
  msix:
    runs-on: windows-latest
    permissions:
      # softprops/action-gh-release の draft Release 作成 + 添付に必要
      # (タグ駆動時のみ実行)
      contents: write
    env:
      # 自己署名 MSIX 用 Repository Secrets (#423)。リリース時は必須。
      # 未投入なら ephemeral cert にフォールバックする (PR ビルドの動作確認用)。
      # WINDOWS_SELFSIGNED_PFX_BASE64: PFX を base64 化したもの
      # WINDOWS_SELFSIGNED_PFX_PASSWORD: 上記 PFX の export password
      WINDOWS_SELFSIGNED_PFX_BASE64: ${{ secrets.WINDOWS_SELFSIGNED_PFX_BASE64 }}
      WINDOWS_SELFSIGNED_PFX_PASSWORD: ${{ secrets.WINDOWS_SELFSIGNED_PFX_PASSWORD }}
      # capsicum-relay の共有シークレット。push 登録の X-Relay-Secret に使う。
      # job レベルに上げておくことで下のガード step の if: 条件で参照できる
      # (secrets context は step の if: で直接読めないため env 経由が必要)。
      # 未投入だと CI 産 MSIX が relay 登録で 401 になり push が全滅する (#474)。
      RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
      # Microsoft Store credentials (#544、on-hold)。job レベルで env に
      # 上げておくことで publish step の if: 条件を評価できる。
      # secrets 未投入なら空文字列になり publish step は skip される。
      MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
      MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
      MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      # WNS push のネイティブ C++（復号 / 鍵読み / ペイロード合成 / 文面ラベル /
      # 観測 / 文字列プリミティブ）のスタンドアロン単体テスト (#474 / #764)。
      # runner ターゲットから除外されており手動 cl ビルド前提だったため、三言語
      # （Dart / Swift / C++）ビット一致の回帰ネットが CI で鳴っていなかった。
      # VS Developer 環境を立てて cl ビルド→実行し、いずれか非 0 で fail させる。
      # flutter build に依存しないので、重いビルドの前段に置いて早期に失敗させる。
      - name: Run native push unit tests
        shell: cmd
        working-directory: packages/capsicum/windows/runner
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if "%VSPATH%"=="" ( echo VS with C++ tools not found & exit /b 1 )
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" >nul
          where cl >nul 2>nul || ( echo cl not on PATH after vcvars & exit /b 1 )
          cl /nologo /EHsc /std:c++17 web_push_decrypt_test.cpp web_push_decrypt.cpp /link bcrypt.lib || exit /b 1
          .\web_push_decrypt_test.exe || exit /b 1
          cl /nologo /EHsc /std:c++17 web_push_key_reader_test.cpp web_push_key_reader.cpp web_push_text_util.cpp /link crypt32.lib shell32.lib ole32.lib version.lib || exit /b 1
          .\web_push_key_reader_test.exe || exit /b 1
          cl /nologo /EHsc /std:c++17 web_push_payload_test.cpp web_push_payload.cpp web_push_text_util.cpp || exit /b 1
          .\web_push_payload_test.exe || exit /b 1
          cl /nologo /EHsc /std:c++17 web_push_receive_test.cpp web_push_receive.cpp web_push_key_reader.cpp web_push_decrypt.cpp web_push_payload.cpp web_push_text_util.cpp notification_type_label.cpp /link crypt32.lib bcrypt.lib shell32.lib ole32.lib version.lib || exit /b 1
          .\web_push_receive_test.exe || exit /b 1
          cl /nologo /EHsc /std:c++17 notification_type_label_test.cpp notification_type_label.cpp || exit /b 1
          .\notification_type_label_test.exe || exit /b 1
          cl /nologo /EHsc /std:c++17 push_diagnostics_test.cpp push_diagnostics.cpp || exit /b 1
          .\push_diagnostics_test.exe || exit /b 1

      # sentry_flutter 9.x が transitive で引き込む jni 0.14.x が
      # JNI_CreateJavaVM のリンクで JDK の jvm.lib (x64) を要求する。
      # windows-latest runner の bundled JDK ではなく、固定 minor の
      # Microsoft OpenJDK 21 を入れて再現性を確保する。
      - name: Setup JDK 21 (x64) for jni transitive
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
          architecture: x64

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6

      - name: Activate melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Generate code (build_runner)
        run: melos run build_runner

      - name: Build Windows release
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          # windows-latest の CMake 4.x が cmake_minimum_required < 3.5 の
          # 互換性を削除し、firebase_cpp_sdk_windows (firebase_core が build 時に
          # 展開する) の同梱 CMakeLists.txt が configure で拒否される
          # (2026-06-12 の runner image 更新から発生)。SDK 側が更新されるまで
          # CMake 公式の互換 escape hatch で 3.5 相当のポリシーを指定する。
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        shell: pwsh
        # Sentry / capsicum-relay 連携キーは GitHub Secrets から渡し、
        # 未設定なら省略 (起動可能、Sentry 送信無効・push 通知無効)。
        # Linux 側 (distribution/linux/appimage/build.sh) と同じ運用。
        run: |
          # 新版検知 (#641) は Windows では渡さない。Store 版と自己署名 MSIX
          # 直配が同じ build 出力を共有していて (Package MSIX step は
          # --build-windows false で本 step の出力を流用、Store publish step も
          # 同じ capsicum.msix を使う) 実行時に区別できないため、DIRECT_CHANNEL
          # を立てると多数派の Store ユーザーにも「更新あり」が出てしまう。
          # 自動更新の無い直配が唯一の配布経路なのは Linux AppImage だけなので、
          # 更新検知は Linux 限定とする (distribution/linux/appimage/build.sh)。
          $defines = @('--dart-define=SENTRY_ENV=production')
          if ($env:SENTRY_DSN)   { $defines += "--dart-define=SENTRY_DSN=$env:SENTRY_DSN" }
          if ($env:RELAY_SECRET) { $defines += "--dart-define=RELAY_SECRET=$env:RELAY_SECRET" }
          Push-Location packages/capsicum
          flutter build windows --release @defines
          Pop-Location

      - name: Guard tag-driven build against ephemeral cert
        # タグ駆動 (リリース) build なのに PFX secret が未投入だと、再現性の
        # ない ephemeral cert で署名した MSIX が draft Release に添付されうる。
        # 誤って publish するとユーザーの TrustedPeople import が次回 build で
        # 別 cert に変わり無効化されるため、ここで明示的に fail させる (#558)。
        # PR / 非タグ build は build 確認用の ephemeral fallback を許容する。
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.WINDOWS_SELFSIGNED_PFX_BASE64 == '' }}
        shell: pwsh
        run: |
          Write-Host "::error::Tag-driven build requires WINDOWS_SELFSIGNED_PFX_BASE64. Refusing to sign a release MSIX with a non-reproducible ephemeral certificate."
          exit 1

      - name: Guard tag-driven build against missing RELAY_SECRET
        # タグ駆動 (リリース) build で RELAY_SECRET が未投入だと、CI 産 MSIX は
        # capsicum-relay への push 登録で X-Relay-Secret 不一致により 401 になり、
        # チャンネル URI を登録できず WNS push が出荷ビルドで全滅する (#474)。
        # 一度この欠落で本番直前まで気付けなかったため、リリースでは明示 fail
        # させる。PR / 非タグ build は RELAY_SECRET なしでも通す (push 無効の
        # 動作確認は成立する)。
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.RELAY_SECRET == '' }}
        shell: pwsh
        run: |
          Write-Host "::error::Tag-driven build requires RELAY_SECRET. Without it the Windows MSIX cannot authenticate to capsicum-relay (HTTP 401 on push registration), so push notifications are dead in the shipped build."
          exit 1

      - name: Prepare signing certificate
        # 自己署名 MSIX 直配 (#423) 用の PFX を準備する。
        # Subject は MSIX の publisher 識別子 (pubspec.yaml の
        # msix_config.publisher) と一致させる必要がある
        # (CN=0B8EE9C3-CB07-4EBE-B8B8-B73E973AEE42)。
        # 通常は Repository Secrets の PFX を復元、未投入時は ephemeral cert
        # にフォールバックして build 確認のみ通す (warning を出す)。
        # 出力パスは ${{ runner.temp }}/capsicum-signing.{pfx,cer} に固定し、
        # 後続 step は同パスを直接参照する (password のみ GITHUB_ENV 経由)。
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "capsicum-signing.pfx"
          $cerPath = Join-Path $env:RUNNER_TEMP "capsicum-signing.cer"
          if ($env:WINDOWS_SELFSIGNED_PFX_BASE64) {
            [System.IO.File]::WriteAllBytes(
              $pfxPath,
              [System.Convert]::FromBase64String($env:WINDOWS_SELFSIGNED_PFX_BASE64)
            )
            $password = $env:WINDOWS_SELFSIGNED_PFX_PASSWORD
          } else {
            Write-Host "::warning::WINDOWS_SELFSIGNED_PFX_BASE64 secret not set; using ephemeral cert. The resulting MSIX is for build verification only — end users cannot install it because the corresponding .cer is unique per run."
            $password = "ephemeral-" + [System.Guid]::NewGuid().ToString("N")
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=0B8EE9C3-CB07-4EBE-B8B8-B73E973AEE42" `
              -KeyUsage DigitalSignature `
              -FriendlyName "capsicum self-signed (ephemeral CI)" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
            $securePassword = ConvertTo-SecureString -String $password -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $securePassword | Out-Null
          }
          Write-Host "::add-mask::$password"
          # PFX から公開鍵 .cer を抽出する (エンドユーザーが信頼ストアに import する用)
          $x509 = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $password)
          [System.IO.File]::WriteAllBytes($cerPath, $x509.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          "CERT_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # MSIX パッケージバージョンを pubspec の version
      # (<major>.<minor>.<patch>+<build>) から <major>.<minor>.<build>.0 へ自動
      # 導出する (#798)。第4オクテット (Revision) は Store 予約で 0 固定・build を
      # 第3オクテット (Build) に載せてビルドごとに一意化する (build は全体で単調
      # 増加のため minor 跨ぎでも単調)。導出値を --version で msix:build /
      # msix:pack に渡す (configuration.dart:87 のとおり --version は pubspec の
      # msix_config.msix_version より優先)。これで毎リリース手動で msix_version を
      # 上げ忘れ、Store フルネーム (9AFBB08E.capsicum_X.Y.Z.0) 重複で製品版提出が
      # 弾かれる footgun を根絶する (v1.43.0 で実際に発生)。
      - name: Derive MSIX version from pubspec build number
        shell: pwsh
        run: |
          $pubspec = Get-Content packages/capsicum/pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^version:\s*(\d+)\.(\d+)\.(\d+)\+(\d+)') {
            Write-Host "::error::Could not parse 'version: <major>.<minor>.<patch>+<build>' from packages/capsicum/pubspec.yaml"
            exit 1
          }
          $msixVersion = "$($Matches[1]).$($Matches[2]).$($Matches[4]).0"
          Write-Host "Derived MSIX version: $msixVersion (pubspec version: $($Matches[1]).$($Matches[2]).$($Matches[3])+$($Matches[4]))"
          "MSIX_VERSION=$msixVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # MSIX 生成は build → patch → pack の 3 段に分ける (#474 フェーズ C)。
      # msix package (3.17.0) は windows.backgroundTasks /
      # activatableClass.inProcessServer 拡張を msix_config から宣言できないため、
      # msix:build が出した AppxManifest.xml に patch スクリプトで拡張を注入し、
      # その後 msix:pack でパッケージ化・署名する。一括の msix:create では
      # patch を挟めない。詳細は patch_appxmanifest_pushtask.ps1 のヘッダ参照。
      #
      # 3 段すべてに --build-windows false / --certificate-path を渡す:
      # - --build-windows false で、前段 `Build Windows release` が --dart-define
      #   (SENTRY_DSN / RELAY_SECRET) 付きで出した build output をそのまま使う
      #   (true だと裏で再ビルドして dart-define が落ちる。Codex P1 指摘)。
      #   build output には CMake install で push_background_task.dll も同梱済み。
      # - --certificate-path 指定で pubspec.yaml の `store: true` より署名フローが
      #   優先される。manifest の Publisher も cert 主体から解決されるため build
      #   段にも渡す。Microsoft Store 公開 (#544) 再開時は別途 `--store` を組む。
      # - --version で前段導出の MSIX_VERSION を渡す (#798)。Identity Version は
      #   build 段が AppxManifest.xml に書くため build に必須。pack にも同値を渡し
      #   config を一貫させる。
      - name: Build MSIX files (unpacked)
        shell: pwsh
        run: |
          Push-Location packages/capsicum
          dart run msix:build `
            --build-windows false `
            --version "$env:MSIX_VERSION" `
            --certificate-path "${{ runner.temp }}\capsicum-signing.pfx" `
            --certificate-password "$env:CERT_PASSWORD"
          Pop-Location

      - name: Patch AppxManifest with push background task
        # msix:build が build/windows/x64/runner/Release/AppxManifest.xml を出すので、
        # そこへ backgroundTasks (Application 配下) と activatableClass.inProcessServer
        # (Package 直下) を注入する。スクリプトは冪等 (注入済みなら skip)。
        # ReadAllText がプロセス cwd で相対解決するため絶対パスで渡す。
        shell: pwsh
        run: |
          $manifest = Join-Path $env:GITHUB_WORKSPACE `
            "packages/capsicum/build/windows/x64/runner/Release/AppxManifest.xml"
          & "$env:GITHUB_WORKSPACE/distribution/windows/patch_appxmanifest_pushtask.ps1" `
            -ManifestPath $manifest

      - name: Pack MSIX (self-signed)
        # patch 済み AppxManifest を含む build folder をパッケージ化し、用意した
        # PFX で signtool 経由で署名する (msix package が内部で signtool を呼ぶ)。
        shell: pwsh
        run: |
          Push-Location packages/capsicum
          dart run msix:pack `
            --build-windows false `
            --version "$env:MSIX_VERSION" `
            --certificate-path "${{ runner.temp }}\capsicum-signing.pfx" `
            --certificate-password "$env:CERT_PASSWORD"
          Pop-Location

      - name: Upload MSIX + .cer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: capsicum-msix
          path: |
            packages/capsicum/build/windows/x64/runner/Release/*.msix
            ${{ runner.temp }}/capsicum-signing.cer
          if-no-files-found: error
          retention-days: 14

      - name: Attach MSIX + .cer to GitHub Release
        # タグ駆動の場合のみ Release への添付を行う。draft 状態で生成するので
        # 自動公開はされず、pooza が GitHub UI でレビューしてから publish する。
        # Linux Release (linux-release.yml) と同じ draft 運用。
        # .cer は pooza の Store 手動 publish 用の MSIX 取り出し口 +
        # 内部ベータ / 開発検証 (install-internal-beta.ps1 が Trusted People
        # に import する) 用に添付する。エンドユーザー向けの配布経路ではなく、
        # Release notes に自己署名証明書の import 手順は書かない
        # (公式配布は Microsoft Store 単独・#760)。
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/capsicum/build/windows/x64/runner/Release/*.msix
            ${{ runner.temp }}/capsicum-signing.cer
          fail_on_unmatched_files: true
          draft: true

      - name: Publish to Microsoft Store (draft submission)
        # タグ駆動 + Repository Secrets 投入済みのときだけ実行する。
        # secrets 未投入時は env が空文字列になり、本 step は skip される
        # (Phase 4 までの動作確認は publish 抜きで成立させる)。
        # msstore は dotnet global tool。windows-latest runner には
        # .NET SDK が同梱済みのため追加セットアップ不要。
        # publish はストア側で draft submission として保留され、
        # pooza が Partner Center でレビューしてから提出操作を行う
        # (Linux / GitHub Releases の draft 運用と同じ思想)。
        if: startsWith(github.ref, 'refs/tags/') && env.MS_STORE_CLIENT_ID != ''
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.MSStore.CLI
          msstore reconfigure `
            --tenantId $env:MS_STORE_TENANT_ID `
            --clientId $env:MS_STORE_CLIENT_ID `
            --clientSecret $env:MS_STORE_CLIENT_SECRET `
            --reset
          msstore publish packages/capsicum/build/windows/x64/runner/Release/capsicum.msix
