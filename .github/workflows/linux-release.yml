name: Linux Release

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    branches: [develop, main]
    paths:
      - 'packaging/linux/**'
      - 'packages/capsicum/linux/**'
      - 'packages/capsicum/pubspec.yaml'
      - '.github/workflows/linux-release.yml'
  workflow_dispatch:

jobs:
  # Phase 4a: portable AppImage を組み立てて GitHub Releases (draft) に添付。
  # Ubuntu 22.04 を使うのは glibc 2.35 (Ubuntu LTS 全代で動く AppImage) 確保のため。
  appimage:
    runs-on: ubuntu-22.04
    permissions:
      # softprops/action-gh-release の draft Release 作成 + 添付に必要 (タグ駆動時のみ実行)
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          # GTK IM module を host から入れる理由 (#532 真因対応 / v1.24.2 + #536 / v1.24.4):
          # GTK の IM module (im-ibus.so / im-fcitx5.so / im-uim.so) は host に
          # インストールされていないと linuxdeploy-plugin-gtk が AppImage に
          # bundle できない。CI runner (ubuntu-22.04) には標準で入っていないため、
          # 配布 AppImage の immodules.cache から該当エントリが欠落し、
          # GTK_IM_MODULE=ibus / fcitx5 / uim を立てても解決できず日本語入力が
          # 一切効かない状態だった。
          #
          # v1.24.4 (#536) で fcitx5 / uim の immodule も同梱対象に拡張。
          # ただし pooza 検証環境は ibus-mozc のみで、fcitx5 / uim は **未検証**。
          # libfcitx5* / libuim* の明示同梱 (libibus と同型の GLib symbol mismatch
          # 対策) は配布後の不具合報告ベースで対応する best-effort 方針。
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libwebkit2gtk-4.1-dev \
            libcurl4-openssl-dev default-jdk-headless \
            libfuse2 patchelf \
            ibus-gtk3 \
            fcitx5-frontend-gtk3 \
            uim-gtk3-immodule

      - name: Install linuxdeploy / appimagetool (with sha256 pin)
        # 各ツールを上流の固定 tag / commit から DL する (#515)。rolling な
        # continuous / master を pin していた構成は、上流が再ビルドするたびに
        # 全リリースがブロックされる構造だった。pin の追従は四半期 chase
        # routine で実施し、上記の固定参照と packaging/linux/appimage/
        # tooling.sha256 をペアで更新する。
        run: |
          mkdir -p ~/.local/bin
          cd ~/.local/bin
          curl -fL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -fL -o linuxdeploy-plugin-gtk.sh \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/3b67a1d1c1b0c8268f57f2bce40fe2d33d409cea/linuxdeploy-plugin-gtk.sh
          curl -fL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          sha256sum -c "$GITHUB_WORKSPACE/packaging/linux/appimage/tooling.sha256"
          chmod +x linuxdeploy linuxdeploy-plugin-gtk.sh appimagetool
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9

      - name: Activate melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Generate code (build_runner)
        run: melos run build_runner

      - name: Build AppImage
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
        run: |
          # build.sh は ~/.config/capsicum/secrets.env を読むので CI でも同様に配置。
          # secrets が未設定の場合は空のまま (Sentry 送信無効・push 通知無効で起動可能)。
          mkdir -p "$HOME/.config/capsicum"
          {
            echo "SENTRY_DSN=${SENTRY_DSN:-}"
            echo "RELAY_SECRET=${RELAY_SECRET:-}"
          } > "$HOME/.config/capsicum/secrets.env"
          bash packaging/linux/appimage/build.sh

      - name: Upload AppImage as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: capsicum-appimage
          path: build/linux/dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Attach AppImage to GitHub Release
        # タグ駆動の場合のみ Release への添付を行う。draft 状態で生成するので
        # 自動公開はされず、pooza が GitHub UI でレビューしてから publish する。
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/linux/dist/*.AppImage
          fail_on_unmatched_files: true
          draft: true

  # AppImage に同梱する metainfo / desktop entry の整合性を低コストで毎回検証する。
  # AppImage ビルド側でも build.sh が embed するため最終的には弾かれるが、早期検知で
  # 失敗を appimage job の終盤まで持ち越さずに済む。
  assets-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils

      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net packaging/linux/shared/net.shrieker.capsicum.metainfo.xml

      - name: Validate desktop entry
        run: desktop-file-validate packaging/linux/shared/net.shrieker.capsicum.desktop
