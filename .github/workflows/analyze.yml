name: Analyze

on:
  push:
    # develop も対象にする。main だけだと開発中はノーガードで、format drift
    # や壊れたテストがリリース PR の瞬間にまとめて跳ね返ってくる（v1.48 で
    # 6 ファイルぶんの drift が溜まり PR の CI が落ちた実績あり）。
    branches: [main, develop]
  pull_request:
    # ⚠ 既定 (opened / synchronize / reopened) には ready_for_review が
    # 含まれない。draft ガード (#987) を入れた以上、明示しないと
    # **draft を ready にした瞬間に run が 1 本も生成されない**。
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

# 同一 ref への連続 push で古い run を完走させない (#987)。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    # draft PR ではスキップする (#987)。pull_request の対象は main のみ＝実質
    # develop → main のリリース PR だけで、その中身は上の push トリガー
    # (branches: [main, develop]) で既に同じコミットを検査済み。draft のあいだは
    # 純粋な二重実行になるため落とす。v1.48 の format drift 対策として入れた
    # push トリガーはそのまま残るので、開発中のガードは失われない。
    #
    # 副作用: pubspec.lock churn ガード (#970) の「PR 全体の差分」粒度での判定は
    # ready 化まで遅れる。push 粒度の判定は develop への push で従来どおり効き、
    # PR 粒度の判定もリリース準備時 (ready 化) には走るため許容する。
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # pubspec.lock churn ガード (#970) が push / PR の差分と範囲内の
          # コミットメッセージを git で参照するため、全履歴を取る。
          fetch-depth: 0
      # #970: pubspec.lock が pubspec.yaml / Flutter pin (workflow) の変更を伴わず
      # 単独で動いていたら落とす。#836 で決めた「揃える前に出た lock 差分はコミット
      # しない」規約を機械で受ける（1fd1a135 で docs コミットに lock のダウングレード
      # が紛れ込み、release PR まで気付かれなかった実績あり）。
      #
      # 抜け道: リリース前の `flutter pub upgrade`（store-release-guide §4.1）は
      # lock だけが動く正当な操作。コミットメッセージを chore(deps) にするか本文に
      # [pubspec-lock] を付けたものは許可する。粒度は「この push / PR の差分」で、
      # develop push でも起動する（release PR を待たず早期に検出できる）。
      - name: Guard pubspec.lock churn (#970)
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # ⚠⚠ **`printf ... | grep -q` を使わないこと (#1036)。**`grep -q` は
          # **マッチした時点で即座に終了**するので、書き込み途中の printf が
          # SIGPIPE で落ちる。`pipefail` があるとパイプライン全体が失敗になり、
          # **条件に合致したときだけ判定が false になる**という逆転が起きる。
          # しかも入力が小さいと printf が書き切れてしまい再現しないため、
          # **コミット数の多い push でだけ落ちる**。v1.61 のリリースで実踏
          # （`chore(deps)` を正しく付けたのに 28 commits の push で誤爆）。
          # 判定は herestring (`<<<`) で渡す。
          if [ "$EVENT" = "pull_request" ]; then
            files="$(git diff --name-only "$PR_BASE"..."$PR_HEAD")"
            msgs="$(git log --format='%s %b' "$PR_BASE".."$PR_HEAD")"
          else
            # ブランチ新規作成（before が全ゼロ）は範囲を取れないのでスキップ。
            if grep -qE '^0+$' <<< "$PUSH_BEFORE"; then
              echo "branch creation push; skip lock guard"; exit 0
            fi
            # force-push すると before は到達不能な SHA になり、git diff が
            # `fatal: bad object` (exit 128) で落ちる。`set -e` があるので
            # 意図した ::error:: ではなく無関係な失敗としてジョブが赤くなる
            # （v1.56 のリリース作業でコミットメッセージを直した際に実踏）。
            # 範囲が取れない push は判定対象外としてスキップする。
            if ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              echo "force-push (before unreachable); skip lock guard"; exit 0
            fi
            files="$(git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA")"
            msgs="$(git log --format='%s %b' "$PUSH_BEFORE".."$GITHUB_SHA")"
          fi

          lock_changed=false
          while IFS= read -r f; do
            case "$f" in
              pubspec.lock|*/pubspec.lock) lock_changed=true ;;
            esac
          done <<< "$files"

          if [ "$lock_changed" != true ]; then
            echo "pubspec.lock unchanged; ok"; exit 0
          fi

          # 随伴の判定は**ファイル名一致ではなく実変更の中身**で行う (#976)。
          # 「pubspec.yaml か workflow のどれかが変わっていれば随伴」だと、
          # バージョンだけの bump や無関係な CI ジョブ編集でも lock の単独更新を
          # 通してしまい、このガードが素通りする（PR #973 の Codex P2）。
          #
          # 変更行だけを取る（-U0 + ヘッダ行 `+++` / `---` を除く）。grep は
          # 不一致で 1 を返すので、`set -e` に巻き込まれないよう `|| true`。
          changed_lines() {
            if [ "$EVENT" = "pull_request" ]; then
              git diff -U0 "$PR_BASE"..."$PR_HEAD" -- "$@"
            else
              git diff -U0 "$PUSH_BEFORE" "$GITHUB_SHA" -- "$@"
            fi | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' || true
          }

          companion_changed=false

          # pubspec.yaml: `version:` 行**だけ**の変更はバンプであって依存の変更
          # ではない。それ以外の行が動いていれば依存セクションが触られたと見なす
          # （dependencies / dev_dependencies / dependency_overrides / SDK 制約は
          # すべてここに落ちる）。
          pubspec_lines="$(changed_lines 'pubspec.yaml' '*/pubspec.yaml')"
          if [ -n "$pubspec_lines" ]; then
            non_version="$(printf '%s\n' "$pubspec_lines" | grep -vE '^[+-]version:' || true)"
            if [ -n "$non_version" ]; then
              companion_changed=true
              echo "pubspec.yaml dependency lines changed"
            else
              echo "pubspec.yaml changed but only the version bump line"
            fi
          fi

          # workflow: 実際に `flutter-version:` の行が動いたときだけ随伴と見なす。
          if [ "$companion_changed" != true ]; then
            wf_lines="$(changed_lines '.github/workflows')"
            if grep -qE '^[+-][[:space:]]*flutter-version:' <<< "$wf_lines"; then
              companion_changed=true
              echo "workflow flutter-version pin changed"
            fi
          fi

          if [ "$companion_changed" = true ]; then
            echo "pubspec.lock changed together with a real dependency / pin change; ok"
            exit 0
          fi
          if grep -qiE 'chore\(deps\)|\[pubspec-lock\]' <<< "$msgs"; then
            echo "lock-only change is an explicit deps/upgrade commit; ok"; exit 0
          fi
          echo "::error::pubspec.lock が pubspec.yaml / Flutter pin (workflow) の変更を伴わず単独で変わっています (#970)。依存を足す/上げるなら pubspec.yaml を、Flutter 版追従なら workflow の pin を同じ変更に含めてください。リリース前の pub upgrade（意図的な lock 単独更新）はコミットメッセージを chore(deps) にするか本文に [pubspec-lock] を付けてください。"
          exit 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # linux-release.yml / windows-release.yml と同じ版に固定する。
          # unpinned だと stable の最新を拾い、出荷ツールチェーンには無い
          # deprecation / lint で CI が落ちる。開発機もこの版に揃えること (#836)。
          flutter-version: 3.44.6
      - run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: packages/fediverse_objects
      - name: Check formatting
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      # test ディレクトリを持つパッケージだけを回す。melos の test スクリプトは
      # 内部で `melos exec` を呼ぶため PATH に melos の実体が要り、`dart run
      # melos` 経由だと command not found になるので使わない（analyze が素の
      # コマンドなのと同じ方針）。
      - name: Test
        run: |
          for pkg in packages/*/; do
            if [ -d "${pkg}test" ]; then
              echo "::group::flutter test ${pkg}"
              (cd "$pkg" && flutter test)
              echo "::endgroup::"
            fi
          done
