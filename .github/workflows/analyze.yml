name: Analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # linux-release.yml / windows-release.yml と同じ版に固定する。
          # unpinned だと stable の最新 (現在 3.44) を拾い、出荷ツール
          # チェーン (3.41.9) には無い deprecation / lint で CI が落ちる。
          flutter-version: 3.41.9
      - run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: packages/fediverse_objects
      - name: Check formatting
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
