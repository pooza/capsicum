name: Analyze

on:
  push:
    # develop も対象にする。main だけだと開発中はノーガードで、format drift
    # や壊れたテストがリリース PR の瞬間にまとめて跳ね返ってくる（v1.48 で
    # 6 ファイルぶんの drift が溜まり PR の CI が落ちた実績あり）。
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # linux-release.yml / windows-release.yml と同じ版に固定する。
          # unpinned だと stable の最新 (現在 3.44) を拾い、出荷ツール
          # チェーン (3.41.9) には無い deprecation / lint で CI が落ちる。
          flutter-version: 3.41.9
      - run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: packages/fediverse_objects
      - name: Check formatting
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      # test ディレクトリを持つパッケージだけを回す。melos の test スクリプトは
      # 内部で `melos exec` を呼ぶため PATH に melos の実体が要り、`dart run
      # melos` 経由だと command not found になるので使わない（analyze が素の
      # コマンドなのと同じ方針）。
      - name: Test
        run: |
          for pkg in packages/*/; do
            if [ -d "${pkg}test" ]; then
              echo "::group::flutter test ${pkg}"
              (cd "$pkg" && flutter test)
              echo "::endgroup::"
            fi
          done
